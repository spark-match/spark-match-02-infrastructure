# =============================================================================
# CD - Terraform Apply (prod)
# =============================================================================
# Apply al ambiente `prod`. Se dispara en:
#   - push a `main` (automatico post-sync desde dev).
#   - workflow_dispatch (manual, con input `reason`).
#
# GH Environment `production`: con required reviewers `@spark-match/devops`,
# auto-approve=false. Requiere aprobacion humana en la GH Environment.
#
# `prevent_self_review` esta en `false` A PROPOSITO, no por descuido. El
# equipo devops tiene dos miembros y en la practica solo uno despliega; con
# self-review prohibido cada despliegue a produccion quedaria esperando a la
# otra persona. Ya ocurrio: un run se quedo 3 dias en `waiting` y detras se
# encadenaron 14 runs cancelandose entre si por concurrencia. La puerta es
# una pausa deliberada, no una revision cruzada. Queda escrito para que nadie
# lea "required reviewers: devops" y asuma cuatro ojos.
#
# EL ROLE ARN VA COMO INPUT LITERAL, NO POR EL BLOQUE `secrets:`
#
# Este workflow mapeaba `AWS_APPLY_ROLE_ARN: ${{ secrets.AWS_APPLY_ROLE_ARN_PROD }}`
# y ese secret NO EXISTE en ningun nivel: el repositorio no tiene ni un solo
# secret de Actions, tampoco esta en los environments ni en la organizacion.
# La expresion resolvia a cadena vacia y `configure-aws-credentials` se
# quedaba sin rol que asumir. Resultado medido: 20 ejecuciones en toda la
# historia de este workflow, ninguna con exito.
#
# El secret que SI existe se llama `AWS_APPLY_ROLE_ARN` (sin sufijo) y vive
# con scope de environment en `production`. Desde aqui no sirve: el bloque
# `secrets:` del caller se evalua SIN environment, porque quien enlaza el
# environment es el job del reusable
# (`environment: ${{ inputs.gh-environment || inputs.environment-name || inputs.environment }}`),
# no este job. Es la misma trampa que tenia plan-prod, documentada en
# terraform-plan-prod.yml: un valor con scope de environment es invisible en
# el `with:`/`secrets:` de quien llama.
#
# El reusable ya ofrece la salida buena y la marca como preferida:
#
#   role-to-assume: ${{ inputs.apply-role-arn != '' && inputs.apply-role-arn
#                       || secrets.AWS_APPLY_ROLE_ARN }}
#
# `apply-role-arn` es un input de tipo string: se evalua sin depender del
# environment y no puede quedarse vacio por sombreado. Un ARN es un
# identificador, no una credencial (ADR-0002), y el account ID ya aparece en
# 15 ficheros de este repositorio.
#
# Se quita ademas `apply-role-arn-secret`, que el propio reusable declara
# como DEPRECATED y dice ignorar.
#
# Lo que este cambio NO arregla: `live/prod` no se ha aplicado nunca (el
# bucket de estado esta vacio), asi que el primer apply no sera un despliegue
# sino la creacion de produccion entera desde cero. Revisar el plan antes.
#
# IAM role: `spark-match-terraform-apply-prod` (write, scope prod). Sus
# managed policies (`spark-match-tf-apply-compute-prod` y
# `-refresh-prod`) se crearon el 2026-08-06 con
# `python bootstrap/apply-bootstrap-policies.py prod --apply`; antes el rol
# existia pero sin ninguna policy adjunta, o sea sin permisos para crear nada.
# Esas policies NO las gestiona Terraform a proposito: ver bootstrap/README.md.
# Naming: el repo usa `prod` consistentemente (var.environment, IAM role,
# S3 bucket, working dir). La GH Environment real se llama `production`
# (alias legacy). El input `gh-environment` permite mapear el nombre
# logico al real.
#
# Reusable workflow origen:
#   spark-match/spark-match-01-devops/.github/workflows/reusable-terraform-apply.yml
# =============================================================================

name: continuous-deployment-terraform-apply-prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual apply"
        type: string
        required: false
        default: "manual trigger"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  apply-prod:
    name: apply-prod
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-terraform-apply.yml@main
    with:
      environment: prod
      gh-environment: production
      working-directory: ${{ vars.WORKING_DIRECTORY_PREFIX }}/prod
      aws-region: ${{ vars.AWS_REGION }}
      # Literal a proposito. Ver la nota de cabecera antes de convertirlo en
      # `vars.` o en un secret: con scope de environment no se resuelve aqui.
      apply-role-arn: arn:aws:iam::681526276858:role/spark-match-terraform-apply-prod
      terraform-version: ${{ vars.TF_VERSION }}
      backend-bucket: spark-match-tfstate-prod
      backend-key: prod/terraform.tfstate
      auto-approve: false

  # ===========================================================================
  # Inyeccion del VALOR de las API keys de terceros (ADR-0003)
  # ===========================================================================
  # Terraform crea el CONTENEDOR del secret; este job pone el VALOR. El reparto
  # existe para que la key no acabe en el tfstate: un
  # `aws_secretsmanager_secret_version` con el valor real lo dejaria en claro en
  # S3, legible por cualquiera con acceso al bucket y en cada version del objeto.
  #
  # `environment:` se declara AQUI, en el job, y no es un detalle: un secret con
  # scope de environment es invisible en el bloque `with:`/`secrets:` de quien
  # llama a un reusable -- la trampa que dejo 20 ejecuciones fallidas en
  # terraform-apply-prod.yml. Al bindear el environment en este job, tanto
  # `secrets.AWS_APPLY_ROLE_ARN` como las API keys se resuelven con normalidad.
  #
  # Corre despues del apply porque el secret tiene que existir antes de poder
  # escribirle un valor.
  push-agent-api-keys:
    name: push-agent-api-keys
    needs: apply-prod
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: push-api-keys
        env:
          TF_ENVIRONMENT: prod
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          set -euo pipefail

          # El nombre lo construye tambien modules/agent-service (locals
          # tavily_secret_name / langsmith_secret_name) y lo autorizan las
          # policies de bootstrap como `secret:spark-match-${environment}-*`.
          # Si la formula cambia, hay que cambiarla en los tres sitios.
          inyectar() {
            etiqueta="$1"
            nombre="spark-match-${TF_ENVIRONMENT}-$2"
            valor="$3"

            # Que el secret no exista NO es un error: significa que el flag de
            # Terraform esta en false y este ambiente corre sin ese servicio.
            if ! aws secretsmanager describe-secret --secret-id "$nombre" >/dev/null 2>&1; then
              echo "::notice::${etiqueta} desactivado en Terraform (no existe ${nombre}); nada que inyectar."
              return 0
            fi

            # Que exista y no haya valor SI lo es. Sin esto el agente arrancaria
            # con el centinela que puso Terraform y el fallo apareceria mucho
            # despues, como un 401 del proveedor que nadie relaciona con esto.
            if [ -z "$valor" ]; then
              echo "::error::${nombre} existe en AWS pero el secret ${etiqueta} no esta cargado en el GitHub Environment 'production'. Cargalo en Settings > Environments, o pon el flag de Terraform en false."
              return 1
            fi

            # Comparar antes de escribir: sin esto cada apply crearia una version
            # nueva del secret, y AWS solo conserva las 100 ultimas.
            actual="$(aws secretsmanager get-secret-value --secret-id "$nombre" --query SecretString --output text 2>/dev/null || true)"
            if [ "$actual" = "$valor" ]; then
              echo "::notice::${nombre} ya tiene el valor vigente; sin cambios."
              return 0
            fi

            aws secretsmanager put-secret-value --secret-id "$nombre" --secret-string "$valor" >/dev/null
            echo "::notice::${nombre} actualizado."
          }

          fallos=0
          inyectar "TAVILY_API_KEY" "tavily-api-key" "${TAVILY_API_KEY:-}" || fallos=1
          inyectar "LANGSMITH_API_KEY" "langsmith-api-key" "${LANGSMITH_API_KEY:-}" || fallos=1
          exit "$fallos"
