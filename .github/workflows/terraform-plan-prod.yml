# =============================================================================
# CI - Terraform Plan (prod)
# =============================================================================
# Plan para el ambiente `prod`. SOLO corre en `workflow_dispatch` (manual).
# No se triggera en PR para evitar exponer state de prod a contribuidores.
#
# Binding de env CONDICIONAL via `${{}}`:
#   - workflow_dispatch: environment = 'production' (bind to env con branch
#     policy, OK porque el ref = `main`).
#
# EL ROLE ARN VA LITERAL, Y NO ES POR PEREZA
#
# Este workflow tenia `plan-role-arn: ${{ vars.AWS_PLAN_ROLE_ARN }}` y la
# cabecera afirmaba que esa expresion resolvia "al env-scoped var (prod ARN),
# precedence sobre repo-wide". Eso NO ocurre, y por eso plan-prod acumulaba 8
# ejecuciones y 0 exitos.
#
# El motivo: un job que llama a un reusable (`uses:`) NO puede declarar
# `environment:` en si mismo; GitHub lo prohibe. Aqui `environment` es un
# INPUT que solo ata el environment DENTRO del reusable. Asi que la expresion
# del bloque `with:` se evalua en el contexto del job llamador, que no tiene
# environment, y `vars.AWS_PLAN_ROLE_ARN` cae al valor de nivel repositorio.
#
# Ese valor de repositorio es el rol de DEV, y a proposito: plan-dev tambien
# corre en pull requests, donde no hay environment y solo puede recibir el ARN
# por input. O sea que plan-prod estaba asumiendo el rol de dev contra el
# bucket de estado de prod. Fallaba en `terraform init` con AccessDenied,
# porque `spark-match-tf-plan-read-dev` solo tiene acceso a
# `spark-match-tfstate-dev`. Ruidoso, no silencioso, pero roto.
#
# Se pone el ARN literal en vez de otra variable porque una variable vuelve a
# abrir la puerta al mismo sombreado, y porque el account ID ya esta en 15
# ficheros de este repo (`live/prod/terraform.tfvars`, `live/prod/main.tf`,
# `modules/oidc-github/policies/prod/*`). Un ARN es un identificador, no una
# credencial: ver ADR-0002.
#
# La misma trampa acecha en apply-dev y apply-prod, que pasan
# `vars.AWS_APPLY_ROLE_ARN`. Ahi funciona de casualidad: NO existe esa variable
# a nivel repositorio, el input queda vacio, y el reusable cae en su fallback
# `secrets.AWS_APPLY_ROLE_ARN`, que si se resuelve dentro del environment. Si
# alguien crea algun dia una variable de repositorio con ese nombre, apply-prod
# empezara a usarla sin avisar.
#
# Si el repo luego crece y se quiere plan prod en PR a `main` solamente
# (repo admins), se puede agregar el trigger `pull_request` con un check
# del actor. Hoy la convencion es: prod plan = manual only.
#
# Reusable workflow origen:
#   spark-match/spark-match-01-devops/.github/workflows/reusable-terraform-plan.yml
# =============================================================================

name: continuous-integration-terraform-plan-prod

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan-prod:
    name: plan-prod
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-terraform-plan.yml@main
    with:
      environment: ${{ github.event_name != 'pull_request' && 'production' || '' }}
      working-directory: ${{ vars.WORKING_DIRECTORY_PREFIX }}/prod
      aws-region: ${{ vars.AWS_REGION }}
      # Literal a proposito. Ver la nota de cabecera antes de convertirlo en
      # una variable: `vars.AWS_PLAN_ROLE_ARN` aqui resuelve al rol de DEV.
      plan-role-arn: arn:aws:iam::681526276858:role/spark-match-terraform-plan-prod
      terraform-version: ${{ vars.TF_VERSION }}
      backend-bucket: spark-match-tfstate-prod
      backend-key: prod/terraform.tfstate
      comment-on-pr: false
