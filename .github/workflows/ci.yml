name: continuous-integration-ci

# SIN `paths:` A PROPOSITO. NO LO VUELVAS A ANADIR.
#
# Un filtro de `paths` y un check requerido son incompatibles por
# construccion. Si el filtro no casa, el workflow no corre; si no corre, el
# check no se publica; y un check requerido que no se publica deja el pull
# request en "Expected - waiting for status to be reported" para siempre. La
# unica salida es el bypass de admin, con lo que el gate deja de ser el check
# y pasa a ser la disciplina de quien puede saltarselo.
#
# No es teorico. Con la lista que habia aqui, 57 de los 161 ficheros del
# repositorio no disparaban ninguno de los 20 contextos requeridos que
# dependen de estos tres workflows. Entre ellos, `bootstrap/**`, que es donde
# viven las policies de IAM -- o sea que el cambio mas frecuente del repo era
# justo el que se mergeaba sin verificar. Medido el 2026-08-07: los PR #187 y
# #189 se mergearon con 1 de 21 checks.
#
# Es ademas el tercer incidente del mismo tipo en este proyecto. Los otros dos
# estan documentados en el manifiesto de governance de 01-devops: el check
# fantasma `commitlint-main`, que solo existia en push, y el CI de 07-article,
# que un filtro de paths podia saltarse. Los tres comparten la forma: la
# verificacion falla en abierto y en silencio.
#
# El coste de quitarlo es que todo PR corre todo, unos 225 s, de los que 200 s
# se los lleva `terraform-validate` por hacer un init por modulo en serie. Si
# algun dia molesta, la solucion NO es volver a poner `paths:`, sino filtrar
# DENTRO del job: un primer step que decida si hay trabajo y salga en verde si
# no lo hay. Asi el check se sigue publicando.
on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Terraform Linting
  # ---------------------------------------------------------------------------
  tflint:
    name: tflint
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-tflint.yml@main
    with:
      environment-name: ""
      terraform-version: ${{ vars.TF_VERSION }}
      working-directory: "."
  # ---------------------------------------------------------------------------
  # Job 2: Git Leaks (Secret Scanning)
  # ---------------------------------------------------------------------------
  gitleaks:
    name: gitleaks
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-gitleaks.yml@main
    with:
      environment-name: ""
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  # ---------------------------------------------------------------------------
  # Job 3: Terraform Validate
  # ---------------------------------------------------------------------------
  terraform-validate:
    name: terraform-validate
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-terraform-validate.yml@main
    with:
      environment-name: ""
      terraform-version: ${{ vars.TF_VERSION }}
      working-directory: "."
  # ---------------------------------------------------------------------------
  # Job 4: SonarCloud Quality Gate
  # ---------------------------------------------------------------------------
  sonar-terraform:
    name: sonar-terraform
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-sonar-terraform.yml@main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      project-key: ${{ vars.SONAR_PROJECT_KEY }}
      project-name: ${{ vars.SONAR_PROJECT_NAME }}
      organization: ${{ vars.SONAR_ORGANIZATION }}
      sources: ${{ vars.SONAR_SOURCES }}
      exclude-patterns: ${{ vars.SONAR_EXCLUDE_PATTERNS }}
      working-directory: "."
      env: "dev"
      fail-on-quality-gate: ${{ vars.SONAR_FAIL_ON_QUALITY_GATE }}

  # ---------------------------------------------------------------------------
  # Job 5: Bats (regression guards for .commitlintrc.json + the
  # local commit-msg hook). Runs only when files under .commitlintrc.json,
  # .pre-commit-hooks/, tests/bats/ change. Mirrors the convention in
  # spark-match-01-devops (one bats job per consumer repo).
  # ---------------------------------------------------------------------------
  quality-bats:
    name: quality / bats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout-repository
        uses: actions/checkout@v7
      - name: install-bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: run-bats
        run: bats tests/bats/
