name: Test Caller Secret Access
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Probe repo-level secrets via env
        run: |
          echo "format=$([[ "$P" =~ ^arn:aws:iam:: ]] && echo arn || echo other)"
          echo "len=${#P}"
          echo "hex16=$(printf '%s' "$P" | head -c 16 | od -An -tx1 | tr -d ' \n')"
        env:
          P: ${{ secrets.AWS_PLAN_ROLE_ARN_DEV }}

      - name: Write to file and cat
        run: |
          echo "P value to stderr"
          echo "$P" >&2
          echo "====="
          echo "hex dump:"
          echo "$P" | xxd | head -5
        env:
          P: ${{ secrets.AWS_PLAN_ROLE_ARN_DEV }}
