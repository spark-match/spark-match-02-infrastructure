repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file-terraform=tf
          - --hook-config=--tag-from-git=true
          - --args=--sort-by-required

  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.25
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  # Conventional Commits enforcement (mirrors the CI-side commitlint
  # check defined in .commitlintrc.json). Lives in .pre-commit-hooks/
  # so it is versioned alongside the repo. The hook script is a
  # pure-bash + grep implementation; it duplicates the minimum subset
  # of the CI rules so contributors get fast feedback at commit time
  # without needing node + npm install to run commitlint locally.
  - repo: local
    hooks:
      - id: commit-msg-conventional
        name: conventional-commits-commit-msg
        description: Validate commit message follows Conventional Commits (mirror of CI commitlint)
        entry: ./.pre-commit-hooks/commit-msg.sh
        language: script
        stages: [commit-msg]
        always_run: true
