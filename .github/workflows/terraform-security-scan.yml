###############################################################################
# CI - Terraform Security Scan (checkov)
###############################################################################
# Escaneo estatico de seguridad sobre el codigo Terraform usando checkov.
# Detecta: SGs con ingress 0.0.0.0/0, S3 sin cifrado, IAM con Action="*"
# sobre Resource="*", KMS sin key policy, etc.
#
# Version: checkov==3.2.415 (alineado con spark-match-01-devops reusable
# workflow checkov.yml default). Mismas reglas detectadas en ambos repos.
#
# Nota: este workflow NO usa el reusable de devops porque necesitamos:
#   - SARIF upload a GitHub code scanning (reusable no expone este output)
#   - Soft-fail (no bloquea el job si hay findings; SARIF igual se sube)
#   - Matrix multi-path (escanea varios modules en paralelo)
# El reusable checkov.yml es para scans atomicos en 1 path. Si en el futuro
# se quiere consolidar, se puede extraer la logica comun al reusable y
# parametrizar SARIF upload via action outputs.
#
# trigger: pull_request contra dev/main, y workflow_dispatch manual.
# output: SARIF subido a GitHub code scanning (no bloquea merge por default).
###############################################################################

name: continuous-integration-terraform-security-scan

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write   # Para subir SARIF a code scanning

jobs:
  checkov:
    name: checkov-${{ matrix.path }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - live/dev
          - live/prod
          - modules/security-groups   # Sprint 1: extracted SGs (has # checkov:skip for CKV2_AWS_5)
          - modules/networking
          - modules/endpoints
          - modules/oidc-github      # Sprint 1: extracted OIDC + IAM roles
          - modules/kms              # Sprint 1: extracted KMS CMK

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set-up-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install-checkov-pinned
        run: pip install --quiet "checkov==3.2.415"

      - name: run-checkov
        working-directory: ${{ matrix.path }}
        run: |
          # soft-fail permite que el job continue aunque haya findings; el SARIF
          # igual se sube a code scanning para visibilidad.
          mkdir -p checkov-output
          checkov \
            --directory . \
            --framework terraform \
            --output cli \
            --output sarif \
            --output-file-path checkov-output \
            --soft-fail \
            || true

      - name: upload-sarif-to-code-scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: ${{ matrix.path }}/checkov-output/results_sarif.sarif
          category: checkov-${{ matrix.path }}
        continue-on-error: true

      - name: upload-raw-logs-as-artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Artifact names cannot contain forward slashes; use github.run_id
          # and github.run_attempt for uniqueness instead of matrix.path.
          name: checkov-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ matrix.path }}/checkov-output
          retention-days: 30
          if-no-files-found: ignore
