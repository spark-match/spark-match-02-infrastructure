# =============================================================================
# CD - Terraform Apply (dev)
# =============================================================================
# Apply al ambiente `dev`. Se dispara en:
#   - push a `dev` (automatico post-merge).
#   - workflow_dispatch (manual, con input `reason`).
#
# GH Environment `dev`: sin required reviewers, auto-approve=true.
# IAM role: `spark-match-terraform-apply-dev` (write, scope dev).
#
# Binding to env `dev` (no condicional): apply corre en push a dev (ref = dev)
# o workflow_dispatch (ref = dev). Ambos pasan la branch policy del env.
# OJO con `vars.AWS_APPLY_ROLE_ARN`: NO resuelve al env-scoped var, aunque
# esta linea lo afirmara hasta el 2026-08-06. Un job con `uses:` no puede
# declarar `environment:`, asi que el bloque `with:` se evalua sin environment
# y esa expresion solo ve variables de repositorio y de organizacion.
#
# Esto funciona por un accidente afortunado: NO existe una variable de
# repositorio con ese nombre, el input queda vacio, y el reusable cae en su
# fallback `secrets.AWS_APPLY_ROLE_ARN`, que si se resuelve dentro del
# environment. Si alguien crea una variable de repositorio asi llamada, este
# workflow empezara a usarla en silencio.
#
# El mismo malentendido dejo plan-prod con 8 fallos y 0 exitos; ahi la variable
# de repositorio SI existe y apunta a dev. Ver la cabecera de
# terraform-plan-prod.yml.
#
# Reusable workflow origen:
#   spark-match/spark-match-01-devops/.github/workflows/reusable-terraform-apply.yml
# =============================================================================

name: continuous-deployment-terraform-apply-dev

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual apply"
        type: string
        required: false
        default: "manual trigger"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  apply-dev:
    name: apply-dev
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-terraform-apply.yml@main
    with:
      environment: dev
      gh-environment: dev
      working-directory: ${{ vars.WORKING_DIRECTORY_PREFIX }}/dev
      aws-region: ${{ vars.AWS_REGION }}
      apply-role-arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
      terraform-version: ${{ vars.TF_VERSION }}
      backend-bucket: spark-match-tfstate-dev
      backend-key: dev/terraform.tfstate
      auto-approve: true
