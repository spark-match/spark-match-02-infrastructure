###############################################################################
# CI - Terraform Security Scan (checkov)
###############################################################################
# Escaneo estatico de seguridad sobre el codigo Terraform usando checkov.
# Detecta: SGs con ingress 0.0.0.0/0, S3 sin cifrado, IAM con Action="*"
# sobre Resource="*", KMS sin key policy, etc.
#
# Version: checkov==3.2.415 (alineado con spark-match-01-devops reusable
# workflow checkov.yml default). Mismas reglas detectadas en ambos repos.
#
# Nota: este workflow NO usa el reusable de devops porque necesitamos:
#   - SARIF upload a GitHub code scanning (reusable no expone este output)
#   - Soft-fail (no bloquea el job si hay findings; SARIF igual se sube)
#   - Matrix multi-path (escanea varios modules en paralelo)
# El reusable checkov.yml es para scans atomicos en 1 path. Si en el futuro
# se quiere consolidar, se puede extraer la logica comun al reusable y
# parametrizar SARIF upload via action outputs.
#
# trigger: pull_request contra dev/main, y workflow_dispatch manual.
# output: SARIF subido a GitHub code scanning. Los matrix jobs
# (checkov-live/*, checkov-modules/*) son required checks en el ruleset
# 18893016 -- estos SI bloquean merge si fallan. El check top-level
# derivado `Checkov` (generado automaticamente por Code Scanning a partir
# del SARIF) **ya NO es required** (fue removido en 2026-08-04 por
# re-reports de alertas pre-existentes en sync PRs grandes -- ver
# AGENTS.md seccion "Admin bypass policy" / "Leccion historica 2026-08-04").
###############################################################################

name: continuous-integration-terraform-security-scan

# Sin `paths:` a proposito: este workflow publica los 14 contextos
# `checkov-*`, todos requeridos, y un check requerido que no se publica
# bloquea el pull request para siempre. Ver la nota larga en ci.yml.
# El trigger de `push` no es opcional: sin el, la linea base de code scanning
# nunca se actualiza y el "N new alerts in this pull request" deja de
# significar nada.
#
# GitHub calcula las alertas nuevas de un PR comparando su analisis contra el
# de la rama base. Ese analisis solo se graba cuando el workflow corre sobre un
# push a la rama. Sin `push:`, la base se quedo congelada el 2026-08-01 con 7
# categorias y 10 resultados, mientras cada PR subia 18 categorias actuales. El
# resultado: el #192 reportaba "2 errors and 41 warnings" nuevos, y la mayoria
# no eran hallazgos sino categorias que la rama no habia visto nunca. Las 7
# alertas que si constaban estaban todas `dismissed` y tres apuntaban a
# `modules/security`, un modulo borrado el 2026-08-01.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write   # Para subir SARIF a code scanning

jobs:
  checkov:
    name: checkov-${{ matrix.path }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - live/dev
          - live/prod
          - modules/security-groups   # Sprint 1: extracted SGs (has # checkov:skip for CKV2_AWS_5)
          - modules/networking
          - modules/endpoints
          - modules/oidc-github      # Sprint 1: extracted OIDC + IAM roles
          - modules/kms              # Sprint 1: extracted KMS CMK
          - modules/notifications
          - modules/storage-sam-artifacts
          - modules/secrets-bootstrap
          - modules/eventbridge-bus
          - modules/dynamodb-idempotency
          - modules/ssm-bootstrap
          - modules/rds-postgres
          - modules/frontend-hosting
          - modules/oidc-frontend
          - modules/ecr              # PR-I2: registry de la imagen del deep-agent
          - modules/agent-service    # PR-I2: ECS Fargate + ALB del deep-agent

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set-up-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install-checkov-pinned
        run: pip install --quiet "checkov==3.2.415"

      - name: run-checkov
        working-directory: ${{ matrix.path }}
        # SIN `--soft-fail` NI `|| true`. NO LOS VUELVAS A ANADIR.
        #
        # Este step tenia las dos cosas, y ademas el upload de abajo tenia
        # `continue-on-error: true`. Tres capas independientes que garantizaban
        # que el job no pudiera fallar nunca. Los 14 contextos `checkov-*` son
        # REQUERIDOS en el ruleset, asi que eran catorce puertas incapaces de
        # cerrarse: su verde significaba "el job termino", no "no hay
        # hallazgos". Medido el 2026-08-07: 262 de 262 en success sobre los 20
        # ultimos PR.
        #
        # El `|| true` era ademas peor que redundante. `--soft-fail` ya evita
        # el fallo por hallazgos, asi que el `|| true` solo podia tragarse otra
        # cosa: que checkov reventara por un error de sintaxis, se quedara sin
        # memoria o ni se instalara. Con el upload silenciado tambien, un
        # escaneo que NUNCA CORRIO se veia identico a uno limpio.
        #
        # Al quitarlos, el job falla si hay hallazgos. Los que existen hoy
        # estan todos justificados con `checkov:skip` en el recurso concreto,
        # que es donde se lee junto al codigo que lo motiva. Si aparece uno
        # nuevo hay dos salidas honestas: arreglarlo, o anadir su skip con el
        # motivo escrito. Silenciar la herramienta entera no es una de ellas.
        run: |
          mkdir -p checkov-output
          checkov \
            --directory . \
            --framework terraform \
            --output cli \
            --output sarif \
            --output-file-path checkov-output

      - name: upload-sarif-to-code-scanning
        # `if: always()` se queda: si checkov encuentra algo y falla el step de
        # arriba, el SARIF tiene que subirse igual para que las alertas se vean
        # en code scanning. Lo que se quita es `continue-on-error`, que hacia
        # que un fallo de la subida pasara desapercibido.
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: ${{ matrix.path }}/checkov-output/results_sarif.sarif
          category: checkov-${{ matrix.path }}

      - name: upload-raw-logs-as-artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Artifact names cannot contain forward slashes; use github.run_id
          # and github.run_attempt for uniqueness instead of matrix.path.
          name: checkov-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ matrix.path }}/checkov-output
          retention-days: 30
          if-no-files-found: ignore
