# =============================================================================
# sonar-project.properties
# =============================================================================
# El grueso de la configuracion del scanner (projectKey, organization, sources,
# exclusions) lo pasa el workflow reusable sonar-terraform por linea de
# comandos y tiene precedencia sobre este archivo. Aca viven SOLO las
# supresiones de reglas puntuales, que necesitan quedar versionadas y
# revisables en un unico lugar en vez de dispersas como comentarios NOSONAR.
#
# Regla de la casa: cada supresion apunta a una regla concreta sobre un archivo
# concreto, nunca a un directorio ni a una regla global, y lleva escrito por
# que se suprime y que la resuelve.
# =============================================================================

sonar.issue.ignore.multicriteria=e1,e2,e3

# -----------------------------------------------------------------------------
# e1 / e2 -- ALB del deep-agent (modules/agent-service)
# -----------------------------------------------------------------------------
# Las dos comparten una sola causa raiz: el agente todavia no esta detras de
# CloudFront. Hoy no existe dominio propio ni certificado ACM para el, asi que
# el ALB solo puede terminar HTTP y no hay bucket de access logs aprovisionado.
#
# Ponerlo detras de CloudFront (que ya termina TLS para el frontend) resuelve
# las dos de una vez: da HTTPS y da access logs. Esta anotado como follow-up
# explicito del plan de despliegue y en modules/agent-service/README.md.
#
# Mitigaciones vigentes mientras tanto:
#   - /ag-ui exige un JWT valido emitido por el backend.
#   - El listener corta /docs, /redoc y /openapi.json con un 404 fijo.
#   - El SG de las tasks solo acepta trafico del SG del ALB.
#   - Los logs de aplicacion (incluido el request log de uvicorn) van al log
#     group /aws/spark-match/agent/{env}/service.
#
# Cuando el agente quede detras de CloudFront, ESTE BLOQUE SE BORRA.

# S6258 - "Omitting access_logs makes logs incomplete."
sonar.issue.ignore.multicriteria.e1.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.e1.resourceKey=modules/agent-service/main.tf

# S5332 - "Make sure allowing clear-text traffic is safe here."
sonar.issue.ignore.multicriteria.e2.ruleKey=terraform:S5332
sonar.issue.ignore.multicriteria.e2.resourceKey=modules/agent-service/main.tf

# -----------------------------------------------------------------------------
# e3 -- bucket destino de los access logs de los informes (ADR-019)
# -----------------------------------------------------------------------------
# S6258 sobre el bucket que RECIBE los server access logs del bucket de
# informes. Activarle logging a el mismo seria circular: sus logs generarian
# logs. Es la excepcion estandar de la industria para buckets destino de access
# logs, y la misma forma que ya tienen modules/storage-sam-artifacts y
# modules/frontend-hosting -- que no figuran aqui solo porque el Quality Gate
# evalua codigo nuevo y esos modulos son anteriores.
#
# El bucket que contiene los datos SI tiene logging
# (aws_s3_bucket_logging.reports, en modules/reports-storage/main.tf) y sigue
# vigilado por esta misma regla. Por eso el bucket de logs se separo a su
# propio fichero: una supresion solo puede apuntar a un fichero completo, asi
# que teniendolos juntos esta excepcion habria tapado tambien el dia que
# alguien dejara el bucket de informes sin registro de accesos.
#
# ESTE BLOQUE NO SE BORRA: la circularidad es permanente, no una deuda.

# S6258 - "Make sure that disabling logging is safe here."
sonar.issue.ignore.multicriteria.e3.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.e3.resourceKey=modules/reports-storage/access-logs.tf
