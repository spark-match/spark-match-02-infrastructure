# =============================================================================
# CI - Terraform Plan (prod)
# =============================================================================
# Plan para el ambiente `prod`. SOLO corre en `workflow_dispatch` (manual).
# No se triggera en PR para evitar exponer state de prod a contribuidores.
#
# Si el repo luego crece y se quiere plan prod en PR a `main` solamente
# (repo admins), se puede agregar el trigger `pull_request` con un check
# del actor. Hoy la convencion es: prod plan = manual only.
#
# Reusable workflow origen:
#   spark-match/spark-match-01-devops/.github/workflows/terraform-plan.yml
# =============================================================================

name: CI - Terraform Plan (prod)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan-prod:
    name: Plan (prod)
    uses: spark-match/spark-match-01-devops/.github/workflows/terraform-plan.yml@main
    secrets:
      AWS_PLAN_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN_PROD }}
    with:
      environment: prod
      working-directory: live/prod
      aws-region: us-east-1
      plan-role-arn-secret: AWS_PLAN_ROLE_ARN_PROD
      terraform-version: '1.10.0'
      backend-bucket: spark-match-tfstate-prod
      backend-key: prod/terraform.tfstate
      comment-on-pr: false
