# =============================================================================
# CI - Terraform Plan (dev)
# =============================================================================
# Plan para el ambiente `dev`. Se dispara en:
#   - pull_request a dev o main (solo plan dev, evita exponer prod state).
#   - workflow_dispatch (manual, con S3 backend).
#
# Binding de env CONDICIONAL via `${{}}`:
#   - pull_request: environment = '' (no binding, sin branch policy check).
#     Esto evita `runner_id: 0` que ocurre cuando el ref `refs/pull/N/merge`
#     no esta en la branch policy del env `dev`. Para PRs, `vars.AWS_PLAN_ROLE_ARN`
#     resuelve al repo-wide var (fallback).
#   - workflow_dispatch: environment = 'dev' (bind to env con branch policy,
#     OK porque el ref = `dev`). `vars.AWS_PLAN_ROLE_ARN` resuelve al env-scoped
#     var (dev ARN) - precedence sobre repo-wide.
#
# Precedence de vars (GitHub Actions):
#   - Si el job bindea a env X y existe `vars.X` como env-scoped, usa env-scoped.
#   - Si no bindea (o env-scoped no existe), usa repo-wide var.
# Esto permite tener 4 roles distintos (plan-dev, plan-prod, apply-dev, apply-prod)
# sin _DEV/_PROD suffix en los nombres - el env hace el scoping.
#
# Por que AWS_PLAN_ROLE_ARN aparece duplicado (repo + env dev) con el mismo valor:
#   - Repo-level var = fallback para PRs (donde environment queda vacio por bug GH
#     Actions runner_id=0 con branch policy + refs/pull/*/merge).
#   - Env-level var = usado en workflow_dispatch (que si bindea al env correctamente).
#   - El valor es identico a proposito: el repo-level solo se lee cuando no hay env
#     binding, asi que ambos apuntan al mismo role (plan-dev). Borrar el repo-level
#     haria que los PRs fallen (sin fallback en el lookup chain).
# AWS_APPLY_ROLE_ARN NO se duplica porque apply solo corre en workflow_dispatch,
# que siempre bindea al env correspondiente.
#
# backend-bucket va SIEMPRE, tambien en PRs. Antes se omitia en PRs con el
# argumento de que "el state bucket no existe para project fresh": eso era
# cierto en el bootstrap y dejo de serlo hace mucho. El efecto era que el
# reusable inicializaba con -backend=false y despues corria `terraform plan`,
# que sin backend muere con "Backend initialization required". El job igual
# quedaba verde porque la receta trataba exit 1 como "sin cambios" -- o sea
# que ningun plan de PR verifico nada nunca. Ver 01-devops#313.
#
# El rol de plan esta hecho para esto: su trust policy incluye `pull_request`
# y tiene s3:GetObject sobre el state pero NO s3:PutObject.
#
# Reusable workflow origen:
#   spark-match/spark-match-01-devops/.github/workflows/reusable-terraform-plan.yml
# =============================================================================

name: continuous-integration-terraform-plan-dev

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan-dev:
    name: plan-dev
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-terraform-plan.yml@main
    with:
      environment: ${{ github.event_name != 'pull_request' && 'dev' || '' }}
      working-directory: ${{ vars.WORKING_DIRECTORY_PREFIX }}/dev
      aws-region: ${{ vars.AWS_REGION }}
      plan-role-arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
      terraform-version: ${{ vars.TF_VERSION }}
      backend-bucket: spark-match-tfstate-dev
      backend-key: dev/terraform.tfstate
      comment-on-pr: ${{ github.event_name == 'pull_request' }}
